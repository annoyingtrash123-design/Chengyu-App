name: Android APK

# Builds an installable debug APK. Download it from the run's "Artifacts".
on:
  workflow_dispatch:
  push:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship with the Android SDK and NDK preinstalled.
      - name: Locate Android NDK
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          else
            yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Data checks and core tests (nothing is published if these fail)
        run: cargo test -p chengyu-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Generate Android project
        working-directory: app
        run: npx tauri android init --ci

      - name: Build APK
        working-directory: app
        run: npx tauri android build --debug --apk --target aarch64 --ci

      - uses: actions/upload-artifact@v4
        with:
          name: chengyu-android-debug-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
